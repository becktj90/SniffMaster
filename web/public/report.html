<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SniffMaster Report</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b1420;
    color: #eef4fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { font-size: 22px; font-weight: 700; }
  .sub { color: #7c93ab; font-size: 14px; margin-top: 2px; }
  .card {
    background: #101c2b;
    border: 1px solid #1c2b3d;
    border-radius: 16px;
    padding: 18px;
    margin-top: 16px;
  }
  .verdict {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-radius: 12px; margin-top: 16px;
    font-weight: 600; font-size: 15px;
  }
  .verdict.good { background: #3ddc8422; border: 1px solid #3ddc84; color: #3ddc84; }
  .verdict.bad { background: #ff5d5d22; border: 1px solid #ff5d5d; color: #ff8080; }
  .lead { font-size: 15px; line-height: 1.5; color: #dbe7f2; margin: 0; }
  .streak { font-size: 13px; color: #f5a623; margin-top: 8px; }
  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-top: 4px;
  }
  .tile { background: #0b1420; border: 1px solid #1c2b3d; border-radius: 12px; padding: 12px; }
  .tile-label { font-size: 12px; color: #7c93ab; }
  .tile-value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .tile-range { font-size: 12px; color: #7c93ab; margin-top: 2px; }
  .tile-delta { font-size: 12px; margin-top: 4px; font-weight: 600; }
  .tile-delta.up { color: #ff8080; }
  .tile-delta.down { color: #3ddc84; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: #7c93ab; margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #0b1420; border: 1px solid #1c2b3d; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .chip.warn { border-color: #f5a623; color: #f5a623; }
  .foot { color: #7c93ab; font-size: 12px; margin-top: 20px; text-align: center; }
  .empty { color: #7c93ab; font-size: 15px; text-align: center; padding: 60px 20px; }
  a.dash-link { color: #7fb8ff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">SniffMaster</div>
    <div class="sub" id="sub">Loading report&hellip;</div>
    <div id="content"></div>
    <div class="foot"><a class="dash-link" href="/">Open the live dashboard &rarr;</a></div>
  </div>
<script>
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(n, d = 0) { return Number.isFinite(n) ? n.toFixed(d) : null; }
const cToF = c => (c * 9) / 5 + 32;

function deltaHtml(pct, higherIsBad = true) {
  if (!Number.isFinite(pct)) return "";
  const dir = pct >= 0 ? "up" : "down";
  const cls = higherIsBad ? dir : (dir === "up" ? "down" : "up");
  return `<div class="tile-delta ${cls}">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}% vs norm</div>`;
}

function tile(label, value, range, deltaPct, higherIsBad = true) {
  if (value == null) return "";
  return `<div class="tile">
    <div class="tile-label">${esc(label)}</div>
    <div class="tile-value">${esc(value)}</div>
    ${range ? `<div class="tile-range">${esc(range)}</div>` : ""}
    ${deltaHtml(deltaPct, higherIsBad)}
  </div>`;
}

function render(s) {
  const sub = document.getElementById("sub");
  const content = document.getElementById("content");
  if (!s || !s.sampleCount) {
    sub.textContent = "";
    content.innerHTML = `<div class="card"><p class="empty">No report available yet. Check back after the next reading or morning report.</p></div>`;
    return;
  }

  const dateLabel = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
  }).format(new Date(s.generatedAt));
  const isOffice = s.environmentType === "office";
  sub.textContent = `${isOffice ? "Office" : "Work area"} report · ${dateLabel} ET`;

  const d = s.deltas || {};
  const parts = [];

  parts.push(`<div class="verdict ${s.controlsStabilizing ? "good" : "bad"}">
    ${s.controlsStabilizing ? "ALL CLEAR" : "NEEDS ATTENTION"} &mdash; ${esc(s.controlsNote || "")}
  </div>`);

  if (s.reportText) {
    parts.push(`<div class="card"><p class="lead">${esc(s.reportText)}</p>
      ${s.problemStreakDays > 1 ? `<div class="streak">Day ${s.problemStreakDays} in a row.</div>` : ""}
      ${s.justRecovered ? `<div class="streak">Back to normal after yesterday's trouble.</div>` : ""}
    </div>`);
  }

  const tiles = [
    s.temp && tile("Temperature", `${fmt(cToF(s.temp.avg), 1)}°F`, `${fmt(cToF(s.temp.min))}–${fmt(cToF(s.temp.max))}°F`, d.tempF),
    s.humidity && tile("Humidity", `${fmt(s.humidity.avg)}%`, `${fmt(s.humidity.min)}–${fmt(s.humidity.max)}%`, d.humidity),
    s.co2 && tile("CO2", `${fmt(s.co2.avg)} ppm`, `${fmt(s.co2.min)}–${fmt(s.co2.max)}`, d.co2),
    s.iaq && tile("Air quality (IAQ)", fmt(s.iaq.avg), `${fmt(s.iaq.min)}–${fmt(s.iaq.max)}`, d.iaq),
    !isOffice && s.gas && tile("Gas resistance", s.gas.avg >= 1e6 ? `${(s.gas.avg/1e6).toFixed(2)} MΩ` : `${Math.round(s.gas.avg/1e3)} kΩ`, "", d.gas, false),
    s.pressure && tile("Pressure", `${fmt(s.pressure.avg)} hPa`, "", null),
  ].filter(Boolean).join("");
  if (tiles) parts.push(`<div class="card"><p class="section-title">24h readings${d.baselineDays ? ` (vs ${d.baselineDays}-day norm)` : ""}</p><div class="tiles">${tiles}</div></div>`);

  const f = s.forecast;
  if (f && typeof f === "object") {
    const chips = [];
    if (Number.isFinite(f.highF) && Number.isFinite(f.lowF)) chips.push(`${Math.round(f.highF)}°/${Math.round(f.lowF)}°F`);
    if (f.condition && f.condition !== "Unknown") chips.push(esc(f.condition));
    if (Number.isFinite(f.precipChance)) chips.push(`Rain ${Math.round(f.precipChance)}%`);
    if (Number.isFinite(f.windMph)) chips.push(`Wind ${Math.round(f.windMph)} mph`);
    if (f.sunrise && f.sunset) chips.push(`Sun ${esc(f.sunrise)}-${esc(f.sunset)}`);
    const thunderChip = f.thunder ? `<span class="chip warn">Thunderstorm risk</span>` : "";
    parts.push(`<div class="card"><p class="section-title">Site outlook &middot; ${esc(f.site || "LC-36")}</p>
      <div class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join("")}${thunderChip}</div>
    </div>`);
  }

  if (s.launchLine) {
    parts.push(`<div class="card"><p class="section-title">Cape launches</p><p class="lead">${esc(s.launchLine)}</p></div>`);
  }

  content.innerHTML = parts.join("");
}

fetch("/api/report-card?format=json", { cache: "no-store" })
  .then(r => r.status === 204 ? null : r.json())
  .then(render)
  .catch(() => {
    document.getElementById("sub").textContent = "";
    document.getElementById("content").innerHTML = `<div class="card"><p class="empty">Couldn't load the report. Try again in a moment.</p></div>`;
  });
</script>
</body>
</html>
