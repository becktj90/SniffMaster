; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Hardware: Seeed XIAO ESP32-C3 (confirmed with esptool: ESP32-C3 QFN32 rev v0.4,
; 4 MB flash). The C3 uses native USB (USB-Serial/JTAG), not a UART bridge.

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; 921600 is too fast for the C3
upload_speed = 460800
board_build.filesystem = littlefs
; huge_app gives more app/TLS space
board_build.partitions = huge_app.csv
; Route Serial to the native USB-Serial/JTAG port and enable it at boot.
; Without these, Serial is not on the USB port.
; CORE_DEBUG_LEVEL=3 is info level (the existing firmware setting).
; NimBLE flags limit BLE to save RAM.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.4
  adafruit/Adafruit SSD1306 @ ^2.5.11
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit BusIO @ ^1.16.1
  adafruit/Adafruit NeoPixel @ ^1.12.2
  h2zero/NimBLE-Arduino @ ^1.4.2
  boschsensortec/bsec2 @ ^1.8.2610
  boschsensortec/BME68x Sensor library @ ^1.1.40407

; The previous [env:xiao_esp32c2] was removed: espressif32@6.5.0 (Arduino core
; 2.0.14) has no ESP32-C2 support and no seeed_xiao_esp32c2 board, so it could
; never build. The real chip is a C3. If a C2 is ever used, it needs a
; pioarduino / Arduino-core-3.x platform.
